[package]
name = "screenqr"
version = "0.1.0"
description = "Private, on-demand screen QR reader for Windows"
edition = "2021"

[lib]
name = "screenqr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rqrr = "0.11"
image = { version = "0.25", default-features = false, features = ["png"] }
serde = { version = "1", features = ["derive"] }
url = "2"

[dev-dependencies]
qrcodegen = "1.8"
serde_json = "1"


[target.'cfg(target_os = "windows")'.dependencies]
xcap = { version = "0.9.8", default-features = false }
windows = { version = "0.62", features = ["Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Com", "Win32_UI_Shell"] }
